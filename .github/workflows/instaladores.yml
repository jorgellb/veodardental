# Compila VeodarDental y crea los instaladores en cada sistema.
# Se lanza a mano (Actions › Instaladores › Run workflow) o al subir una
# etiqueta de versión (git tag v0.2.0 && git push --tags); con etiqueta los
# instaladores se publican también como «Release» del repositorio.
#
# Linux: un solo programa, compilado con la glibc de AlmaLinux 8 (2.28), en
# todos los paquetes (.deb, .rpm, Arch, AppImage y portable), para que funcione
# en las distribuciones antiguas y en las nuevas; después se instala de verdad
# en contenedores limpios de cada distribución (tools/probar_paquetes_linux.sh).
#
# Firma (T-F3-03). Cada firma solo se hace si están sus secretos; si no,
# los instaladores salen SIN FIRMAR y así lo dice FIRMA.txt en cada
# artefacto. Nunca se rebajan controles del sistema para quitar avisos.
# - Windows (signtool): WINDOWS_CERT_PFX (el .pfx en base64) y WINDOWS_CERT_PASSWORD.
# - macOS (codesign y notarización): APPLE_CERTIFICATE (el .p12 en base64),
#   APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY, APPLE_ID,
#   APPLE_PASSWORD (contraseña de aplicación) y APPLE_TEAM_ID.
# - Paquete de actualización (--actualizar, ver src/actualizar.rs):
#   VEODARDENTAL_CLAVE_FIRMA (clave Ed25519 PKCS#8 en hexadecimal; su parte
#   pública va en actualizar::RELEASE_KEYS).
# Se firma solo al construir una etiqueta de versión (v*), nunca en una
# ejecución a mano desde otra rama. Conviene además guardar estos secretos
# en un entorno de GitHub («firma») con revisores obligatorios.
#
# Las acciones van fijadas a un commit (no a una etiqueta, que se puede
# mover): estos pasos manejan los secretos de firma.
name: Instaladores

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

# Solo lectura; publicar la versión (escribir) es un trabajo aparte, y solo con etiqueta.
permissions:
  contents: read

jobs:
  # Las pruebas, en cada sistema: compilar en Linux no demuestra que funcione en
  # Windows o en macOS (B-24).
  pruebas:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Bibliotecas de Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev openssl
      - name: Pruebas automáticas
        run: cargo test --workspace --all-targets --locked

  instaladores:
    needs: pruebas
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            nombre: windows
            formatos: nsis,wix
          - os: macos-latest
            nombre: macos-apple-silicon
            formatos: app,dmg
          # macos-13 ya no está disponible en GitHub; esta es la imagen Intel actual.
          - os: macos-15-intel
            nombre: macos-intel
            formatos: app,dmg
    runs-on: ${{ matrix.os }}
    env:
      FIRMA_WINDOWS: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.WINDOWS_CERT_PFX != '' && secrets.WINDOWS_CERT_PASSWORD != '' }}
      FIRMA_APPLE: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_SIGNING_IDENTITY != '' }}
      NOTARIZAR_APPLE: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_ID != '' && secrets.APPLE_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Herramienta de instaladores
        run: cargo install cargo-packager --locked
      - name: Compilar
        run: cargo build --release --locked
      - name: Empaquetar
        run: cargo packager --release --formats ${{ matrix.formatos }}

      # ── el programa compilado arranca en Windows y en macOS (sin ventana) ──
      - name: Comprobar el programa compilado
        shell: bash
        run: |
          set -euo pipefail
          bin=target/release/veodardental
          if [ "$RUNNER_OS" = "Windows" ]; then bin="$bin.exe"; fi
          mkdir -p "$RUNNER_TEMP/raiz"
          VEODARDENTAL_RAIZ="$RUNNER_TEMP/raiz" "$bin" --comprobar

      # ── instalar de verdad y arrancar lo instalado (B-24): el .msi en Windows,
      #    el .dmg en macOS. Sin firmar, así que solo en estos equipos de prueba. ──
      - name: Instalar el .msi y arrancar lo instalado
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $msi = Get-ChildItem dist\*.msi | Select-Object -First 1
          $p = Start-Process msiexec.exe -ArgumentList "/i `"$($msi.FullName)`" /qn /norestart /l*v `"$env:RUNNER_TEMP\instalar.log`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\instalar.log" -Tail 40; exit $p.ExitCode }
          $exe = Get-ChildItem -Path $env:ProgramFiles, ${env:ProgramFiles(x86)}, $env:LOCALAPPDATA -Recurse -Filter veodardental.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { Write-Error "No se encuentra el programa instalado"; exit 1 }
          Write-Output "Instalado en $($exe.FullName)"
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\raiz-instalada" | Out-Null
          $env:VEODARDENTAL_RAIZ = "$env:RUNNER_TEMP\raiz-instalada"
          & $exe.FullName --comprobar
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Instalar el .dmg y arrancar lo instalado
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          dmg=$(ls dist/*.dmg | head -1)
          hdiutil attach "$dmg" -mountpoint /Volumes/VeodarDental -nobrowse -quiet
          cp -R /Volumes/VeodarDental/*.app /Applications/
          hdiutil detach /Volumes/VeodarDental -quiet
          app=$(ls -d /Applications/VeodarDental*.app | head -1)
          echo "Instalado en $app"
          mkdir -p "$RUNNER_TEMP/raiz-instalada"
          VEODARDENTAL_RAIZ="$RUNNER_TEMP/raiz-instalada" "$app/Contents/MacOS/veodardental" --comprobar

      # ── firma en Windows (solo con certificado) ──
      - name: Firmar los instaladores de Windows
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Windows' && env.FIRMA_WINDOWS == 'true'
        shell: pwsh
        env:
          PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "firma.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1
          foreach ($f in Get-ChildItem dist\*.exe, dist\*.msi) {
            & $signtool.FullName sign /f $pfx /p $env:PFX_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 $f.FullName
            & $signtool.FullName verify /pa $f.FullName
          }
          Remove-Item $pfx

      # ── firma y notarización en macOS (solo con certificado y cuenta) ──
      - name: Firmar (y notarizar) en macOS
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'macOS' && env.FIRMA_APPLE == 'true'
        shell: bash
        env:
          P12: ${{ secrets.APPLE_CERTIFICATE }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          kc="$RUNNER_TEMP/firma.keychain-db"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/firma.p12"
          security create-keychain -p "" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "" "$kc"
          security import "$RUNNER_TEMP/firma.p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$kc"
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          app=$(ls -d dist/*.app | head -1)
          codesign --force --deep --options runtime --timestamp --sign "$IDENTITY" "$app"
          codesign --verify --deep --strict "$app"
          rm -f dist/*.dmg
          hdiutil create -volname VeodarDental -srcfolder "$app" -ov -format UDZO dist/VeodarDental.dmg
          codesign --force --timestamp --sign "$IDENTITY" dist/VeodarDental.dmg
          if [ "$NOTARIZAR_APPLE" = "true" ]; then
            xcrun notarytool submit dist/VeodarDental.dmg --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
            xcrun stapler staple dist/VeodarDental.dmg
          fi
          rm -f "$RUNNER_TEMP/firma.p12"

      # ── qué se ha firmado (para no declarar firmado lo que no lo está); un
      #    fichero por sistema, para que al publicar no se pisen ──
      - name: Estado de la firma
        shell: bash
        run: |
          {
            echo "Sistema: ${{ matrix.nombre }}"
            echo "Windows firmado: $([ "$FIRMA_WINDOWS" = "true" ] && [ "${{ runner.os }}" = "Windows" ] && echo sí || echo no)"
            echo "macOS firmado: $([ "$FIRMA_APPLE" = "true" ] && [ "${{ runner.os }}" = "macOS" ] && echo sí || echo no)"
            echo "macOS notarizado: $([ "$FIRMA_APPLE" = "true" ] && [ "$NOTARIZAR_APPLE" = "true" ] && [ "${{ runner.os }}" = "macOS" ] && echo sí || echo no)"
          } > dist/FIRMA-${{ matrix.nombre }}.txt
          cat dist/FIRMA-${{ matrix.nombre }}.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: VeodarDental-${{ matrix.nombre }}
          path: |
            dist/*.exe
            dist/*.msi
            dist/*.dmg
            dist/FIRMA-*.txt
          if-no-files-found: error

  # Linux: aquí se ejecutan contenedores y herramientas de fuera, así que este
  # trabajo nunca ve la clave de firma (se firma en «firmar-actualizacion»).
  linux:
    needs: pruebas
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: Herramientas de paquetes
        run: |
          sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev libfuse2
          cargo install cargo-packager cargo-generate-rpm --locked
      - name: Compilar (glibc 2.28, en AlmaLinux 8)
        run: tools/compilar_linux.sh
      - name: Crear los paquetes
        run: tools/paquetes_linux.sh

      # ── el .deb por dentro ──
      - name: Comprobar el paquete .deb
        shell: bash
        run: |
          set -euo pipefail
          deb=$(ls dist/*.deb | head -1)
          mkdir -p comprobar && cd comprobar
          ar x "../$deb"
          tar -xf data.tar.*
          test -x usr/bin/veodardental
          test -f usr/share/applications/*.desktop
          ls usr/share/icons/hicolor/*/apps/ >/dev/null
          VEODARDENTAL_RAIZ="$PWD/raiz" ./usr/bin/veodardental --comprobar

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: VeodarDental-linux
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
            dist/*.AppImage
            dist/VeodarDental-*-linux-*.tar.gz
          if-no-files-found: error

  # Instalar de verdad en cada distribución (contenedores limpios), arrancar lo
  # instalado y desinstalarlo. Rocky 8 es la más antigua (glibc 2.28).
  linux-distribuciones:
    needs: linux
    strategy:
      fail-fast: false
      matrix:
        distro: ["rockylinux:8", "ubuntu:20.04", "ubuntu:24.04", "debian:12", "debian:13", "fedora:latest", "opensuse/leap:15.6", "archlinux:latest", "portable"]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: VeodarDental-linux
          path: dist
      - name: Instalar y arrancar en ${{ matrix.distro }}
        run: tools/probar_paquetes_linux.sh "${{ matrix.distro }}"

  # Manifiesto firmado para --actualizar, con el programa de Linux ya probado.
  # La clave solo la ve el firmador, compilado antes y sin ella desde una copia
  # limpia del repositorio; nada de lo que corrió en contenedores la ve.
  firmar-actualizacion:
    needs: linux-distribuciones
    runs-on: ubuntu-22.04
    env:
      FIRMA_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.VEODARDENTAL_CLAVE_FIRMA != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: VeodarDental-linux
          path: paquetes
      - name: Compilar el firmador (sin la clave)
        if: env.FIRMA_VERSION == 'true'
        run: cargo build --release --locked --example firmar_version
      - name: Firmar el paquete de actualización
        if: env.FIRMA_VERSION == 'true'
        shell: bash
        env:
          VEODARDENTAL_CLAVE_FIRMA: ${{ secrets.VEODARDENTAL_CLAVE_FIRMA }}
        run: |
          set -euo pipefail
          mkdir -p programa dist/actualizacion
          tar -xzf paquetes/VeodarDental-*-linux-*.tar.gz -C programa
          cp programa/VeodarDental-*/veodardental dist/actualizacion/
          datos=$(sed -n 's/^pub const DATA_VERSION: u32 = \([0-9]*\);.*/\1/p' src/model.rs)
          target/release/examples/firmar_version dist/actualizacion "${GITHUB_REF_NAME#v}" "$datos"
      - name: Estado de la firma
        shell: bash
        run: |
          mkdir -p dist
          {
            echo "Sistema: linux"
            echo "Paquete de actualización firmado: $([ "$FIRMA_VERSION" = "true" ] && echo sí || echo no)"
          } > dist/FIRMA-linux.txt
          cat dist/FIRMA-linux.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: VeodarDental-actualizacion
          path: |
            dist/FIRMA-linux.txt
            dist/actualizacion/
          if-no-files-found: error

  publicar:
    needs: [instaladores, linux, linux-distribuciones, firmar-actualizacion]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Publicar en la versión
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/*.exe
            dist/*.msi
            dist/*.dmg
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
            dist/*.AppImage
            dist/VeodarDental-*-linux-*.tar.gz
            dist/FIRMA-*.txt
